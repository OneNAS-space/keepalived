name: Build keepalived Package
permissions:
  contents: read

on:
  push:
    branches:
      - main
    paths-ignore:
      - '.github/**'
      - 'local-patches/**'
      - 'README.md'
      - 'LICENSE'
      - 'SECURITY.md'
  workflow_dispatch:

env:
  PKG_NAME: keepalived
  FEEDNAME: jackie264
  SDK_VERSION: openwrt-25.12
  RELEASE_DIR: packages-25.12

jobs:
  check:
    name: 1. Resolve Version
    runs-on: ubuntu-latest
    outputs:
      pkg_version: ${{ steps.version.outputs.pkg_version }}
      upstream_release: ${{ steps.version.outputs.upstream_release }}
      pkg_release: ${{ steps.version.outputs.pkg_release }}
      tag_name: ${{ steps.version.outputs.tag_name }}

    steps:
      - name: 🧾 Checkout repo
        uses: actions/checkout@v7

      - name: 🏷️ Resolve version (PKG_RELEASE always newer than official)
        id: version
        run: |
          set -euo pipefail

          PKG_VERSION=$(sed -n 's/^PKG_VERSION:=//p' Makefile | head -n1 | tr -d '[:space:]')
          UPSTREAM_RELEASE=$(sed -n 's/^PKG_RELEASE:=//p' Makefile | head -n1 | tr -d '[:space:]')
          if [ -z "$PKG_VERSION" ] || [ -z "$UPSTREAM_RELEASE" ]; then
            echo "❌ Cannot read PKG_VERSION/PKG_RELEASE from Makefile"; exit 1
          fi

          BASE_TS=$(git log -1 --format=%ct)
          PKG_RELEASE=$(( (BASE_TS - 1767225600) / 60 ))

          if [[ "$UPSTREAM_RELEASE" =~ ^[0-9]+$ ]] && [ "$PKG_RELEASE" -le "$UPSTREAM_RELEASE" ]; then
            echo "❌ Computed release r${PKG_RELEASE} is not newer than upstream r${UPSTREAM_RELEASE}"; exit 1
          fi

          TAG="v${PKG_VERSION}-r${PKG_RELEASE}"
          echo "🏷️ Official : ${PKG_VERSION}-r${UPSTREAM_RELEASE}"
          echo "🏷️ Ours     : ${PKG_VERSION}-r${PKG_RELEASE}"

          {
            echo "pkg_version=$PKG_VERSION"
            echo "upstream_release=$UPSTREAM_RELEASE"
            echo "pkg_release=$PKG_RELEASE"
            echo "tag_name=$TAG"
          } >> "$GITHUB_OUTPUT"

  build:
    name: 2. Build ${{ matrix.arch }}
    needs: check
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        arch:
          - x86_64
          - aarch64_cortex-a53
          - arm_cortex-a7_neon-vfpv4

    steps:
      - name: 🧾 Checkout repo
        uses: actions/checkout@v7

      - name: 🧰 Set up Feed structure
        run: |
          set -e
          mkdir -p "feed/${PKG_NAME}"

          rsync -av \
            --exclude='/.git' \
            --exclude='/feed' \
            --exclude='/.github' \
            --exclude='/local-patches' \
            --exclude='/SECURITY.md' \
            --exclude='/README.md' \
            --exclude='/LICENSE' \
            --exclude='/.upstream_meta' \
            --exclude='/.official_version_release' \
            ./ "feed/${PKG_NAME}/"

      - name: 🩹 Override PKG_RELEASE (build copy only, never committed)
        run: |
          set -euo pipefail
          REL="${{ needs.check.outputs.pkg_release }}"
          MF="feed/${PKG_NAME}/Makefile"

          sed -i "s/^PKG_RELEASE:=.*/PKG_RELEASE:=${REL}/" "$MF"

          if ! grep -qx "PKG_RELEASE:=${REL}" "$MF"; then
            echo "❌ Failed to override PKG_RELEASE in $MF"; exit 1
          fi
          echo "✅ Build copy Makefile:"
          grep -E '^PKG_(VERSION|RELEASE):=' "$MF"

      - name: 🧮 Compute ARCH
        run: echo "ARCH=${{ matrix.arch }}-${SDK_VERSION}" >> "$GITHUB_ENV"

      - name: 🏗️ Build with OpenWrt SDK
        uses: openwrt/gh-action-sdk@v11
        env:
          ARCH: ${{ env.ARCH }}
          FEEDNAME: ${{ env.FEEDNAME }}
          PACKAGES: ${{ env.PKG_NAME }}
          INDEX: 0
          FEED_DIR: ${{ github.workspace }}/feed
          NO_SHFMT_CHECK: 1
          NO_REFRESH_CHECK: 1

      - name: 📦 Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.PKG_NAME }}__${{ matrix.arch }}
          path: bin/packages/*/${{ env.FEEDNAME }}/${{ env.PKG_NAME }}*.apk
          if-no-files-found: error

  deploy:
    name: 3. Deploy ${{ github.repository }}
    needs: [check, build]
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: ./release-assets

      - name: 🔑 Checkout custom-packages repo
        uses: actions/checkout@v7
        with:
          repository: OneNAS-space/custom-packages
          token: ${{ secrets.CUSTOM_PACKAGES_TOKEN }}
          path: custom-packages

      - name: 🚚 Update keepalived artifacts
        run: |
          set -e
          TAG="${{ needs.check.outputs.tag_name }}"
          UPSTREAM_REL="${{ needs.check.outputs.upstream_release }}"

          for d in release-assets/${PKG_NAME}__*; do
            [ -d "$d" ] || continue
            arch="${d##*/}"
            arch="${arch#*__}"

            TDIR="custom-packages/releases/${RELEASE_DIR}/${arch}/packages"

            mkdir -p "$TDIR"
            echo "🧹 Cleaning old ${PKG_NAME} versions in $TDIR..."
            rm -f "$TDIR/${PKG_NAME}"-*.apk

            COUNT=0
            while IFS= read -r f; do
              echo "📥 Deploying $(basename "$f") -> $TDIR/"
              cp "$f" "$TDIR/"
              COUNT=$((COUNT + 1))
            done < <(find "$d" -type f -name '*.apk')

            if [ "$COUNT" -eq 0 ]; then
              echo "❌ No .apk found in $d"
              find "$d" -type f
              exit 1
            fi

            git -C custom-packages add "${TDIR#custom-packages/}/"
          done

          cd custom-packages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Update ${PKG_NAME} to ${TAG} (official r${UPSTREAM_REL})"
          for i in {1..5}; do
            git pull --rebase origin main && \
            git push origin main && break || \
            (echo "Conflict detected, retrying in 5s..." && sleep 5)
          done
