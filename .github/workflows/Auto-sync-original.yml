name: Auto sync and sanitize upstream repo
permissions:
  contents: write

on:
  schedule:
    - cron: '18 */2 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'local-patches/**'

env:
  TZ: Asia/Shanghai
  UPSTREAM_REPO: https://github.com/openwrt/packages.git
  UPSTREAM_PATH: net/keepalived        # 上游仓库中该包所在目录
  TARGET_PKG: keepalived               # 官方 index.json 中的包名
  FEED: packages                       # 官方 feed 名称 (packages / luci)
  PATCH_DIR: local-patches

jobs:
  sync-and-sanitize:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout target repo
        uses: actions/checkout@main
        with:
          token: ${{ secrets.TOKEN_KEEPALIVED }}
          fetch-depth: 0

      - name: Set up Git
        run: |
          git config --global user.name "Jackie-Bot"
          git config --global user.email "jackie@actions.local"

      - name: Add upstream and fetch
        run: |
          git remote add upstream "$UPSTREAM_REPO" || true
          echo "🔄 Fetching upstream..."
          git fetch upstream master

      - name: Fetch and Compare Official Version
        run: |
          # Each entry: "<url>|<channel>" — channel is "snapshot" or "release"
          SOURCES=(
            "https://downloads.openwrt.org/snapshots/packages/x86_64/${FEED}/index.json|snapshot"
            "https://downloads.openwrt.org/releases/packages-25.12/x86_64/${FEED}/index.json|release"
            "https://downloads.openwrt.org/snapshots/packages/arm_cortex-a7_neon-vfpv4/${FEED}/index.json|snapshot"
            "https://downloads.openwrt.org/releases/packages-25.12/arm_cortex-a7_neon-vfpv4/${FEED}/index.json|release"
            "https://downloads.openwrt.org/snapshots/packages/aarch64_cortex-a53/${FEED}/index.json|snapshot"
            "https://downloads.openwrt.org/releases/packages-25.12/aarch64_cortex-a53/${FEED}/index.json|release"
          )

          : > /tmp/fetched_versions.txt
          for SRC in "${SOURCES[@]}"; do
            URL="${SRC%%|*}"
            CHANNEL="${SRC##*|}"
            echo "🔍 Checking [$CHANNEL]: $URL"
            VER=$(curl -sL --retry 3 "$URL" | jq -r --arg pkg "$TARGET_PKG" '.packages[$pkg] // empty' 2>/dev/null || true)

            if [ -n "$VER" ] && [ "$VER" != "null" ]; then
              echo "   ↳ Found version: $VER"
              echo "${VER}|${CHANNEL}" >> /tmp/fetched_versions.txt
            else
              echo "   ↳ ⚠️ Package not found or download failed."
            fi
          done

          if [ ! -s /tmp/fetched_versions.txt ]; then
            echo "⚠️ Failed to fetch version from ALL sources, keeping previously recorded versions."
          fi

          NEW_REL_VER=$(grep '|release$' /tmp/fetched_versions.txt | cut -d'|' -f1 | sort -V | tail -n 1 || true)
          NEW_SNAP_VER=$(grep '|snapshot$' /tmp/fetched_versions.txt | cut -d'|' -f1 | sort -V | tail -n 1 || true)
          [ -z "$NEW_REL_VER" ] && NEW_REL_VER="none"
          [ -z "$NEW_SNAP_VER" ] && NEW_SNAP_VER="none"

          OLD_REL_VER=$(cat .official_version_release 2>/dev/null || echo "none")
          OLD_SNAP_VER=$(cat .official_version_snapshot 2>/dev/null || echo "none")

          [ "$NEW_REL_VER" = "none" ] && NEW_REL_VER="$OLD_REL_VER"
          [ "$NEW_SNAP_VER" = "none" ] && NEW_SNAP_VER="$OLD_SNAP_VER"

          NEW_CHANNEL=""
          if [ "$NEW_REL_VER" != "none" ] && [ "$NEW_REL_VER" != "$OLD_REL_VER" ]; then
            NEW_CHANNEL="release"
          fi
          if [ "$NEW_SNAP_VER" != "none" ] && [ "$NEW_SNAP_VER" != "$OLD_SNAP_VER" ]; then
            if [ -z "$NEW_CHANNEL" ]; then NEW_CHANNEL="snapshot"; else NEW_CHANNEL="both"; fi
          fi

          if [ -n "$NEW_CHANNEL" ]; then
            echo "VERSION_CHANGED=true" >> $GITHUB_ENV
            echo "✅ Version changed! Update channel: $NEW_CHANNEL"
            echo "   ↳ Release: $OLD_REL_VER -> $NEW_REL_VER"
            echo "   ↳ Snapshot: $OLD_SNAP_VER -> $NEW_SNAP_VER"
          else
            echo "VERSION_CHANGED=false" >> $GITHUB_ENV
            echo "💤 Version unchanged."
            NEW_CHANNEL="both"
          fi

          echo "NEW_REL_VER=$NEW_REL_VER" >> $GITHUB_ENV
          echo "NEW_SNAP_VER=$NEW_SNAP_VER" >> $GITHUB_ENV
          echo "NEW_CHANNEL=$NEW_CHANNEL" >> $GITHUB_ENV

      - name: Assemble Raw Materials & Generate Precision Changelog
        run: |
          if git ls-remote --exit-code --heads origin Official-original; then
            git fetch origin Official-original
            git checkout Official-original
          else
            echo "Creating a pristine orphan branch..."
            git checkout --orphan Official-original
          fi

          NEW_HASH=$(git log -n 1 --format="%H" upstream/master -- "$UPSTREAM_PATH")

          if [ -f .upstream_meta ]; then
            OLD_HASH=$(sed -n '1p' .upstream_meta)
          else
            echo "⚠️ .upstream_meta not found! Fallback to path-specific historical commit."
            OLD_HASH=$(git log -n 1 --skip=5 --format="%H" upstream/master -- "$UPSTREAM_PATH")
            [ -z "$OLD_HASH" ] && OLD_HASH=$NEW_HASH
          fi

          CHANGELOG=$(git log --oneline ${OLD_HASH}..${NEW_HASH} -- "$UPSTREAM_PATH" || true)
          [ -z "$CHANGELOG" ] && CHANGELOG="No changes in this range."

          {
            echo "SYNC_COMMIT_MSG<<EOF_GHA"
            echo "Sync: upstream updates ($UPSTREAM_PATH)"
            echo ""
            echo "===== 📌 Upstream Commits ====="
            echo "$CHANGELOG"
            if [ "$VERSION_CHANGED" = "true" ]; then
              echo ""
              echo "===== 🚀 Official Version Update ====="
              echo "Update Channel: $NEW_CHANNEL"
              echo "Release Version: $NEW_REL_VER"
              echo "Snapshot Version: $NEW_SNAP_VER"
            fi
            echo "EOF_GHA"
          } >> $GITHUB_ENV

          git rm -rf --cached . 2>/dev/null || true
          find . -mindepth 1 -maxdepth 1 \
            ! -name '.git' \
            ! -name '.upstream_meta' \
            ! -name '.official_version_release' \
            ! -name '.official_version_snapshot' \
            ! -name '.official_channel' \
            -exec rm -rf {} +

          echo "$NEW_HASH" > .upstream_meta
          echo "$NEW_REL_VER" > .official_version_release
          echo "$NEW_SNAP_VER" > .official_version_snapshot
          echo "$NEW_CHANNEL" > .official_channel

          echo "📥 Extracting $UPSTREAM_PATH from upstream..."
          git checkout upstream/master -- "$UPSTREAM_PATH"
          shopt -s dotglob
          mv "$UPSTREAM_PATH"/* .
          shopt -u dotglob
          rm -rf "${UPSTREAM_PATH%%/*}"

      - name: Push completely assembled raw files to Official-original
        run: |
          git add -A
          if ! git diff-index --quiet HEAD -- 2>/dev/null; then
            git commit -m "$SYNC_COMMIT_MSG"
            git push "https://x-access-token:${{ secrets.TOKEN_KEEPALIVED }}@github.com/${{ github.repository }}.git" Official-original --force
          else
            echo "Perfect. No updates detected in upstream."
          fi

      - name: Switch to main and prepare patching environment
        run: |
          git checkout main

          echo "🧹 Cleaning up legacy generated files in main..."
          find . -mindepth 1 -maxdepth 1 \
            ! -name '.git' \
            ! -name '.github' \
            ! -name "$PATCH_DIR" \
            ! -name 'README.md' \
            ! -name 'LICENSE' \
            ! -name 'SECURITY.md' \
            ! -name '.upstream_meta' \
            ! -name '.official_version_release' \
            ! -name '.official_version_snapshot' \
            ! -name '.official_channel' \
            -exec rm -rf {} +

          echo "📥 Overlaying pristine raw materials from Official-original..."
          git checkout Official-original -- .

      - name: Apply Custom Patches Pipeline
        run: |
          set -e
          shopt -s nullglob
          PATCHES=("$PATCH_DIR"/*.patch)

          if [ ${#PATCHES[@]} -eq 0 ]; then
            echo "ℹ️ No patches found in $PATCH_DIR/, skipping."
            exit 0
          fi

          DEPTH=$(echo "$UPSTREAM_PATH" | awk -F/ '{print NF}')
          STRIPS="$((DEPTH + 1)) 1"

          for patch_file in $(printf '%s\n' "${PATCHES[@]}" | sort); do
            echo ""
            echo "🔎 Detecting the patch status: $patch_file ..."

            STATE=""
            for P in $STRIPS; do
              if patch -p"$P" --dry-run -R --silent < "$patch_file" >/dev/null 2>&1; then
                STATE="applied"; break
              fi
              if patch -p"$P" --dry-run --silent < "$patch_file" >/dev/null 2>&1; then
                STATE="apply"; STRIP="$P"; break
              fi
            done

            case "$STATE" in
              applied)
                echo "⏭️ [Skip] Upstream already contains this patch."
                ;;
              apply)
                echo "🩹 Applying $patch_file (-p$STRIP) ..."
                patch --batch -p"$STRIP" < "$patch_file"
                echo "✅ $patch_file applied successfully!"
                ;;
              *)
                echo "❌ Critical Error: $patch_file is neither already applied nor cleanly appliable."
                echo "---- dry-run diagnostics (-p$((DEPTH + 1))) ----"
                patch -p"$((DEPTH + 1))" --dry-run < "$patch_file" || true
                echo "---- files in working tree ----"
                ls -la . files 2>/dev/null || true
                exit 1
                ;;
            esac
          done

          chmod +x files/*.init files/*.sh 2>/dev/null || true

      - name: Commit and push to main
        run: |
          git add -A

          if git diff-index --quiet HEAD --; then
            if [ "$VERSION_CHANGED" = "false" ]; then
              echo "No modification changes detected on main branch."
              exit 0
            fi
          fi

          git commit --allow-empty -m "[Patched] $SYNC_COMMIT_MSG"
          git push "https://x-access-token:${{ secrets.TOKEN_KEEPALIVED }}@github.com/${{ github.repository }}.git" main --force
